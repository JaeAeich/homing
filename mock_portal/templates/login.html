{% extends "base.html" %}
{% block main %}
  <h1>Sign in to Acme Payer</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  {% if captcha %}<div class="h-captcha"
     data-sitekey="mock"
     style="width:300px;
            height:78px;
            border:1px solid #999">Verify you are human</div>{% endif %}
  {% if layout == Layout.V2 %}
    <div class="x9">
      <div class="wrap">
        <form method="post" action="/login" class="frm-a">
          <input type="hidden" name="authenticity_token" value="{{ csrf }}">
          <div class="row">
            <div class="cell">Password</div>
            <input class="in-b" id="pw-field" name="password" type="password">
          </div>
          <div class="row">
            <div class="cell">Username</div>
            <input class="in-a" id="user-field" name="username" type="text">
          </div>
          <div class="row">
            <button class="go" type="submit">Continue</button>
          </div>
        </form>
      </div>
    </div>
  {% else %}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="authenticity_token" value="{{ csrf }}">
      <label for="username">Username</label><input id="username"
       name="username"
       type="text"
       class="form-control">
      <label for="password">Password</label><input id="password"
       name="password"
       type="password"
       class="form-control">
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  {% endif %}
{% endblock %}
