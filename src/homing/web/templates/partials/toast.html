<div class="toast"
     role="status"
     aria-atomic="true"
     aria-hidden="false"
     data-category="{{ category }}">
  <div class="toast-content">
    <section>
      <h2>{{ title }}</h2>
      <p>{{ description }}</p>
    </section>
    <footer>
      <button type="button" class="btn" data-variant="outline">Dismiss</button>
    </footer>
  </div>
</div>
