[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.28,<0.10" ]

[project]
name = "homing"
version = "0.1.0"
description = "Durable, recipe-driven, deterministic portal automation."
readme = "README.md"
license = "MIT"
authors = [ { name = "Javed Habib" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.15",
  "cryptography>=50.0.2",
  "dbos>=3.3",
  "fastapi>=0.143.2",
  "filelock>=4.2",
  "httpx>=0.28.1",
  "humanize>=4.16",
  "imap-tools>=1.16",
  "jinja2>=3.1.6",
  "lxml>=6.1.3",
  "playwright>=1.64",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16",
  "pyotp>=2.10",
  "pypdf>=6.20.1",
  "python-dotenv>=1.2.4",
  "python-multipart>=0.0.32",
  "rich>=15",
  "ruamel-yaml>=0.19.1",
  "structlog>=26.1",
  "tenacity>=9.2.1",
  "typer>=0.27.3",
  "uvicorn>=0.54",
]
scripts.homing = "homing.cli:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "deptry>=0.25.1",
  "djlint>=1.46.6",
  "editorconfig-checker>=3.11.1",
  "httpx2>=2.13.1",
  "mdformat>=0.7.22",
  "mdformat-gfm>=1",
  "pre-commit>=4.7",
  "prek>=0.5.5",
  "pyproject-fmt>=2.30.3",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.4",
  "ruff>=0.17.1",
  "ty>=0.0.88",
  "typos>=1.51.1",
  "validate-pyproject[all]>=0.26",
  "vulture>=2.16",
  "yamllint>=1.38",
  "zizmor>=1.31.1",
]
mock = [
  "fpdf2>=2.8.9",
]

[tool.uv]
default-groups = [ "dev", "mock" ]

# ---------------------------------------------------- djlint (Jinja templates)
[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 80
format_attribute_template_tags = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 80
src = [ "mock_portal", "src", "tests", "tools" ]
extend-exclude = [ "vulture_whitelist.py" ]  # a list of bare names by design
output-format = "concise"
format.quote-style = "double"
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # conflicts with formatter
  "CPY001", # no copyright header per file (LICENSE covers it)
  "D203",   # prefer D211 (no blank line before class docstring)
  "D213",   # prefer D212 (summary on first line)
  "FIX002", # TODOs are allowed
  "ISC001", # conflicts with formatter
  "TD002",  # TODO author not required
  "TD003",  # TODO issue link not required
]
lint.per-file-ignores."src/homing/cli/*.py" = [
  "FBT001", # Typer options are boolean flags by design
  "FBT002",
]
lint.per-file-ignores."tests/**" = [
  "ANN",      # fixtures need no annotations
  "ASYNC240", # tiny fixture file reads in async tests are fine
  "D",        # tests are self-describing
  "INP001",   # tests are not a package
  "PLR2004",  # magic values are expected values
  "S101",     # assert is the point of tests
  "S105",     # fake secrets are test data
  "S106",
  "S603",     # tests spawn our own CLI and mock portal
  "S607",
  "SLF001",   # tests may poke private members
]
lint.per-file-ignores."tools/**" = [ "INP001", "T201" ]
lint.flake8-type-checking.runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
]
lint.isort.combine-as-imports = true
lint.isort.known-first-party = [ "homing", "mock_portal" ]
lint.pycodestyle.max-doc-length = 80
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 6

# ------------------------------------------------- deptry (dependency hygiene)
[tool.deptry]
# Used without an import statement:
#   lxml             -> BeautifulSoup(markup, "lxml") picks the parser by name
#   python-multipart -> FastAPI needs it to parse Form(...) bodies
per_rule_ignores.DEP002 = [ "lxml", "python-multipart" ]
# fpdf is test infrastructure (mock portal PDFs, `make bootstrap`), never
# imported by homing
per_rule_ignores.DEP004 = [ "fpdf" ]
known_first_party = [ "homing", "mock_portal", "mutate_html", "support" ]

# --------------------------------------------------------- vulture (dead code)
[tool.vulture]
paths = [ "mock_portal", "src", "tools", "vulture_whitelist.py" ]
# Registered by decorator, called by the framework, not by our code.
ignore_decorators = [
  "@action",
  "@app.*",
  "@contextlib.asynccontextmanager",
  "@DBOS.*",
  "@field_validator",
  "@hook",
  "@model_validator",
  "@runs_app.*",
]
min_confidence = 60

# ---------------------------------------------------------------- pyproject-fmt
[tool.pyproject-fmt]
column_width = 80
indent = 2
max_supported_python = "3.12"  # only advertise what CI tests

[tool.typos]
# --------------------------------------------------------- typos (spell check)
files.extend-exclude = [
  "src/homing/web/static/vendor/", # third-party minified code
  "tests/fixtures/",               # saved third-party HTML
  "samples/*/evidence/",           # captured pages, verbatim
  "uv.lock",
]

[tool.ty]
src.include = [ "mock_portal", "src", "tests", "tools" ]
src.exclude = [ "vulture_whitelist.py" ]
# tests import support.py and tools/mutate_html.py
environment.extra-paths = [ "tests", "tools" ]
# ---------------------------------------------------- ty (Astral type checker)
environment.python-version = "3.12"
rules.possibly-unresolved-reference = "error"
rules.redundant-cast = "error"
rules.unused-ignore-comment = "error"
terminal.error-on-warning = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ ".", "tests" ]  # mock_portal, support.py
ini_options.markers = [
  "leaks: secret leak scan",
  "live: real GitHub (manual)",
  "mock: full runs against the mock portal",
  "offline: resolver against saved HTML, no network",
  "unit: pure unit tests",
]
ini_options.filterwarnings = [ "error" ]  # a new deprecation fails the build
ini_options.asyncio_default_fixture_loop_scope = "function"
# ---------------------------------------------------------------- pytest
ini_options.asyncio_mode = "auto"
ini_options.timeout = 120

[tool.coverage]
# ---------------------------------------------------------------- coverage
run.source = [ "homing" ]
run.branch = true
run.parallel = true
# The mock suite runs the CLI in subprocesses; measure those too.
run.patch = [ "subprocess" ]
report.fail_under = 80
report.exclude_also = [
  "^\\s*\\.\\.\\.$",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.skip_covered = true
report.show_missing = true
