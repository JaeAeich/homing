# Test infrastructure for the mock payer portal. The CLI itself runs natively
# (`make run`).
# Phase 3 adds: homing (dashboard + worker), postgres (DBOS), jaeger.
services:
  greenmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=demo:secret@acme-payer.test
        -Dgreenmail.users.login=local_part
    ports: ["3025:3025", "3143:3143"]

  mock-portal:
    build: { context: ., dockerfile: Dockerfile.mock }
    environment:
      ACME_MFA: email
      ACME_SMTP_HOST: greenmail
    ports: ["8080:8080"]
    depends_on: [greenmail]
