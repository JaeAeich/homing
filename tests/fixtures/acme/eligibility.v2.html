<h1>Eligibility for Jane Example</h1>
<form method="get" action="/eligibility/result" target="_top" class="elig-form" aria-label="Eligibility">
  <input type="hidden" name="member" value="M-1001">
  
  <div class="grid"><div class="g1"><span class="lbl">Date of service</span><input class="d-x" name="dos" type="date"></div></div>
  <div class="grid"><div class="g1"><span class="lbl">Plan</span><select class="s-x" name="plan"><option value="">Choose a plan</option><option value="PPO Gold">PPO Gold</option><option value="HMO Silver">HMO Silver</option></select></div></div>
  <div class="grid"><div class="g1"><span class="lbl">Service type</span><select class="s-y" name="service_type" disabled></select></div></div>
  <div class="grid"><button class="b-x" type="submit">Look up</button></div>
  
</form>
<script>
const services = {"HMO Silver": ["Office visit", "Lab work"], "PPO Gold": ["Office visit", "Physical therapy"]};
const form = document.querySelector('.elig-form');
const plan = form.querySelector('[name=plan]');
const st = form.querySelector('[name=service_type]');
plan.addEventListener('change', () => {
  st.innerHTML = '';
  (services[plan.value] || []).forEach(s => st.add(new Option(s, s)));
  st.disabled = !plan.value;
});
</script>
