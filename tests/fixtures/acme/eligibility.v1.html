<main>
<h1>Eligibility for Jane Example</h1>
<form method="get" action="/eligibility/result" target="_top" class="elig-form" aria-label="Eligibility">
  <input type="hidden" name="member" value="M-1001">
  
  <label for="plan">Plan</label><select id="plan" name="plan" class="plan-select"><option value="">Choose a plan</option><option value="PPO Gold">PPO Gold</option><option value="HMO Silver">HMO Silver</option></select>
  <label for="service_type">Service type</label><select id="service_type" name="service_type" disabled></select>
  <label for="dos">Date of service</label><input id="dos" name="dos" type="date">
  <button type="submit" class="btn-check">Check eligibility</button>
  
</form>
<script>
const services = {"HMO Silver": ["Office visit", "Lab work"], "PPO Gold": ["Office visit", "Physical therapy"]};
const form = document.querySelector('.elig-form');
const plan = form.querySelector('[name=plan]');
const st = form.querySelector('[name=service_type]');
plan.addEventListener('change', () => {
  st.innerHTML = '';
  (services[plan.value] || []).forEach(s => st.add(new Option(s, s)));
  st.disabled = !plan.value;
});
</script>
